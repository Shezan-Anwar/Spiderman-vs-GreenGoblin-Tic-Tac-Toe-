<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe game</title>
    <link rel="stylesheet" href="style.css">

    
</head>
<body>
    <main>
        <div id="music">
            <button id="muteBtn">🎵 Mute</button>
        </div>
        <audio id="bgmusic" src="spider_nwh_theme.mp3" loop></audio>
        <h1 id="title">Spiderman v/s Goblin</h1>
        <div class="winn hide">
            <h1 id="msg">Winner</h1>
            <button id="newgame">New Game</button>
        </div>
       
        
        <div class="container">
            <img id="spiderchn" src="spidermanchance.png" >
        <div class="game">
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
        </div>
        <img id="goblinchn" src="gobinchance.png" >
        </div>
        
        <button class="reset">Reset Game</button>
         
        
        
        
        
    </main>
    <script src="app.js"></script>
</body>
</html>
